version: '3.8'

services:
  # -------------------- BACKEND SERVICE --------------------
  backend:
    container_name: food_backend
    # 🟢 KHỐI BUILD ĐÃ ĐƯỢC THÊM LẠI
    build: 
      context: ./backend 
      dockerfile: Dockerfile
    # 🟢 KHỐI env_file ĐÃ ĐƯỢC THÊM LẠI
    env_file:
      - ./backend/.env
    ports:
      - "4000:10000" # Mapp cổng 10000 (container) ra cổng 4000 (host)
    environment:
      # Sửa URL redirect của Stripe
      # Có thể ghi đè các biến này qua env_file hoặc biến môi trường host
      FRONTEND_URL: http://localhost
      ADMIN_URL: http://localhost:8080
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:10000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # -------------------- FRONTEND SERVICE (CLIENT) --------------------
  frontend:
    container_name: food_frontend
    build: 
      context: ./frontend
      dockerfile: Dockerfile
      args: 
        # Cấu hình gọi API từ trình duyệt Host
        - VITE_API_URL=http://localhost:4000 
    ports:
      - "80:80" 
    depends_on:
      backend:
        condition: service_healthy

  # -------------------- ADMIN SERVICE (DASHBOARD) --------------------
  admin:
    container_name: food_admin
    build: 
      context: ./admin
      dockerfile: Dockerfile
      args:
        # Cấu hình gọi API từ trình duyệt Host
        - VITE_API_URL=http://localhost:4000
        # ADMIN_API_KEY phải khớp với backend/.env (ghi đè qua env_file hoặc biến host)
        - VITE_ADMIN_API_KEY=${ADMIN_API_KEY:-dev-admin-key}
    ports:
      - "8080:80" 
    depends_on:
      backend:
        condition: service_healthy